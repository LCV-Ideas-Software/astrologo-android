<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Superfície pública mínima do projeto Astrologo Android da LCV Ideas &amp; Software."
    />
    <link rel="canonical" href="https://astrologo-android.lcv.dev/" />
    <title>Astrologo Android — LCV Ideas &amp; Software</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        background: #120b24;
        color: #f8f5ff;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, #432a70, #120b24 58%);
      }
      main {
        width: min(46rem, 100%);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #7256a0;
        border-radius: 1.5rem;
        background: rgb(27 16 51 / 92%);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
      }
      p { color: #ded2f5; }
      .eyebrow {
        color: #d8b4fe;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 {
        margin: .25rem 0 1rem;
        font-size: clamp(2.3rem, 9vw, 4.5rem);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">LCV Ideas &amp; Software</p>
      <h1>Astrologo Android</h1>
      <p>
        Repositório público em preparação. Ainda não existe aplicativo Android
        funcional ou release publicado nesta superfície.
      </p>
    </main>
  </body>
</html>
